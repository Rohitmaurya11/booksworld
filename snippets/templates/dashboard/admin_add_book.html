{% load static %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
    body {
        background: #f5f7fb;
    }

    .add-book-card {
        max-width: 850px;
        margin: 40px auto;
        padding: 30px;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0px 4px 14px rgba(0,0,0,0.08);
    }

    .section-title {
        font-weight: 700;
        font-size: 24px;
        text-align: center;
        color: #0d6efd;
        margin-bottom: 20px;
    }

    .form-label {
        font-weight: 600;
    }

    .custom-nav {
        box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
    }
</style>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top custom-nav">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'admin_dashboard' %}">
            👑 Admin Panel
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#managerNavbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="managerNavbar">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin_dashboard' %}">Dashboard</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'admin_manage_books' %}">Manage Books</a>
                </li>

            </ul>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="nav-link text-light">Hello, {{ request.user.username }}</span>
                </li>

                <li class="nav-item">
                    <a class="btn btn-danger btn-sm ms-2" href="{% url 'logout' %}">Logout</a>
                </li>
            </ul>

        </div>
    </div>
</nav>

<div style="margin-top: 110px;"></div>

<!-- ADD BOOK CARD -->
<div class="add-book-card">

    <h3 class="section-title">➕ Add New Book</h3>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row">

            <div class="col-md-6">
                <label class="form-label">Book Title</label>
                <input type="text" name="title" class="form-control mb-3" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Author</label>
                <input type="text" name="author" class="form-control mb-3" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Publish Date</label>
                <input type="date" name="publish_date" class="form-control mb-3" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Category</label>
                <select name="category" class="form-select mb-3" required>
                    <option value="">Select Category</option>
                    {% for category in categories %}
                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" rows="3" class="form-control mb-3"></textarea>
            </div>

            <div class="col-md-6">
                <label class="form-label">Book Cover</label>
                <input type="file" name="cover_image" class="form-control mb-3" accept="image/*">
            </div>

            <div class="col-md-6">
                <label class="form-label">Book File</label>
                <input type="file" name="book_file" class="form-control mb-3" accept=".pdf,.epub,.txt,.doc,.docx">
            </div>

        </div>

        <div class="text-center">
            <button class="btn btn-primary px-4 py-2">Add Book</button>
            <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary px-4 py-2 ms-2">Back</a>
        </div>

    </form>

</div>
