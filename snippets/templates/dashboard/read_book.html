{% block content %}
{% load static %}

<div class="container mt-4">

    <h2 class="mb-3">{{ book.title }}</h2>
    <h5 class="text-muted">By {{ book.author }}</h5>

    <hr>

    <h4>📖 Read Book</h4>
    <!-- <p>File URL: {{ book.book_file.url }}</p> -->
    {% if book.book_file %}
    <!-- DISPLAY PDF FROM DB -->
    <iframe src="{{ book.book_file.url }}#toolbar=0" width="100%" height="700px" style="border-radius:8px;">
    </iframe> {% else %}
    <p class="text-danger">No book file uploaded.</p>
    {% endif %}

</div>

{% endblock %}
