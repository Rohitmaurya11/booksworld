<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Manage Categories | Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

    <style>
        body {
            background: #f4f6fa;
            font-family: "Segoe UI", sans-serif;
        }

        .card {
            border-radius: 16px;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'admin_dashboard' %}">
                👑 Admin Panel
            </a>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <span class="nav-link text-warning">
                        Welcome, {{ request.user.username }}
                    </span>
                </li>
                <li class="nav-item">
                    <a class="btn btn-danger btn-sm ms-2" href="{% url 'logout' %}">
                        Logout
                    </a>
                </li>
            </ul>
        </div>
    </nav>

    <br /><br />

    <div class="container mt-5">
        <h3 class="mb-4">📂 Manage Categories</h3>

        <!-- ADD CATEGORY CARD -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="input-group">
                        <input type="text" name="category_name" class="form-control"
                            placeholder="Enter new category name" required />
                        <button class="btn btn-dark">
                            <i class="bi bi-plus-circle"></i> Add Category
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- CATEGORY TABLE -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-bordered mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Category Name</th>
                            <th style="width: 120px">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for category in categories %}
                        <tr>
                            <td>{{ forloop.counter }}</td>
                            <td>{{ category.name }}</td>
                            <td>
                                <a href="{% url 'delete_category' category.id %}" class="btn btn-danger btn-sm"
                                    onclick="return confirm('Delete this category?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-center p-4">
                                No categories available.
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
