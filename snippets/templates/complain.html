{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Complaint</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      background: #cbd4eb;
      font-family: "Poppins", sans-serif;
      padding-top: 80px;
    }

    .navbar-modern {
      background: #506dab;
    }

    .navbar-modern .nav-link {
      color: #e5e7eb !important;
      margin-left: 15px;
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f7cff, #6236ff);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
    }

    .complaint-box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.08);
    }

    .footer {
      background: linear-gradient(135deg, #506dab, #1f2937);
      color: white;
      padding: 25px;
      text-align: center;
      margin-top: 60px;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-modern fixed-top">
    <div class="container">
      <a class="navbar-brand" href="{% url 'index' %}">📚 Book World</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavBar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavBar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'index' %}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'category' %}">Categories</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'about' %}">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'contact' %}">Contact</a>
          </li>

          {% if user.is_authenticated %}
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" data-bs-toggle="dropdown">
              <div class="user-avatar">{{ user.username|first|upper }}</div>
              <span class="ms-2">{{ user.username }}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" href="#">Profile</a>
              </li>
              <li>
                <hr class="dropdown-divider" />
              </li>
              <li>
                <a class="dropdown-item text-danger" href="{% url 'logout' %}">Logout</a>
              </li>
            </ul>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <div class="container col-md-6 mt-5">
    <div class="complaint-box">
      <h3 class="text-center mb-3">Submit Complaint</h3>
      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Book Title</label>
          <input type="text" name="book_title" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Complaint Type</label>
          <select name="complaint_type" class="form-control" required>
            <option value="">Select Complaint Type</option>
            <option value="missing">Missing Book</option>
            <option value="wrong_info">Wrong Information</option>
            <option value="quality">Bad Quality</option>
            <option value="other">Other Issue</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea name="message" class="form-control" rows="3" required></textarea>
        </div>

        <button class="btn btn-primary">Submit Complaint</button>
      </form>
    </div>
  </div>

  <footer class="footer">© 2026 Book World</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
