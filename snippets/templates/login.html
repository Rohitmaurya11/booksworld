{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Book World</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            font-family: "Segoe UI", sans-serif;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 380px;
            padding: 35px;
            border-radius: 18px;
            background: white;
            color: #333;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            border: 1px solid #ececec;
        }

        .login-container img {
            width: 60px;
            margin-bottom: 5px;
        }

        .login-container h2 {
            margin: 10px 0;
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .login-container p {
            color: #555;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .message-box {
            background: #ff4d4d;
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .input-label {
            float: left;
            font-weight: 600;
            color: #555;
            margin-top: 10px;
            font-size: 14px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            font-size: 15px;
            color: #333;
            background: #fafafa;
        }

        .input-field:focus {
            border: 1px solid #0d6efd;
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 48px;
            cursor: pointer;
            font-size: 15px;
            color: #777;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            font-size: 17px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-login:hover {
            background: #084298;
        }

        .extra-links {
            margin-top: 15px;
            font-size: 15px;
        }

        .extra-links a {
            color: #0d6efd;
            font-weight: bold;
            text-decoration: none;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- Logo -->
        <img src="{% static 'logo.png' %}" alt="Book World">

        <h2>Welcome back!</h2>
        <p>Please log in.</p>

        <!-- Show messages -->
        <!-- {% if messages %}
            {% for message in messages %}
                <div class="message-box">{{ message }}</div>
            {% endfor %}
        {% endif %} -->

        <form method="POST">
            {% csrf_token %}

            <label class="input-label">Username</label>
            <input type="text" class="input-field" name="username" placeholder="Enter username" required>

            <label class="input-label">Password</label>
            <div class="password-wrapper">
                <input type="password" class="input-field" id="password" name="password" placeholder="Enter password" required>
                <span class="toggle-password" onclick="togglePassword()">👁</span>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>

        <div class="extra-links">
            Don't have an account? 
            <a href="{% url 'signup' %}">Sign up</a>
        </div>

    </div>

    <script>
        function togglePassword() {
            let input = document.getElementById("password");
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>

</body>
</html>
